<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceGrad - My Profile</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #1e40af;
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 15px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-section {
            margin-bottom: 25px;
        }

        .profile-section h3 {
            color: #4b5563;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #e5e7eb;
            padding-bottom: 8px;
        }

        .profile-item {
            margin-bottom: 15px;
        }

        .profile-item .label {
            font-weight: 600;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .profile-item .value {
            font-size: 16px;
            color: #111827;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="header">
            <h1><i class="fas fa-user-circle"></i> My Profile</h1>
            <div class="header-buttons">
                <button id="backBtn" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </button>
                <button id="logoutBtn" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="card">
            <h2><i class="fas fa-id-card"></i> Profile Information</h2>
            <div id="profileContent" class="profile-grid">
                <!-- Profile data will be loaded here -->
                <div class="loading"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const backBtn = document.getElementById('backBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const profileContent = document.getElementById('profileContent');
        const alertBox = document.getElementById('alertBox');

        // API Configuration
        const API_BASE_URL = window.location.origin + '/api';

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthentication();
            setupEventListeners();
            loadProfileData();
        });

        // Setup event listeners
        function setupEventListeners() {
            backBtn.addEventListener('click', () => {
                window.location.href = '/dashboard';
            });
            logoutBtn.addEventListener('click', handleLogout);
        }

        // Check if user is authenticated
        function checkAuthentication() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                // Redirect to login page if not authenticated
                window.location.href = '/login.html';
                return;
            }

            // Check if token is valid
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 < Date.now()) {
                    // Token expired
                    handleLogout();
                }
            } catch (error) {
                console.error('Invalid token:', error);
                handleLogout();
            }
        }

        // Load user profile data
        async function loadProfileData() {
            profileContent.innerHTML = '<div class="loading"></div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/user/profile`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load profile data');
                }

                const data = await response.json();
                if (data.success) {
                    displayProfileData(data.user);
                } else {
                    throw new Error(data.message || 'Failed to load profile data');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                profileContent.innerHTML = `<p>Error loading profile data: ${error.message}</p>`;
                showAlert('error', 'Failed to load profile data');
            }
        }

        // Display profile data
        function displayProfileData(user) {
            const profile = user.profile || {};
            
            // Create HTML for profile data
            let html = `
                <div class="profile-section">
                    <h3>Account Information</h3>
                    <div class="profile-item">
                        <div class="label">Username</div>
                        <div class="value">${user.username || 'Not set'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Email</div>
                        <div class="value">${user.email || 'Not set'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Role</div>
                        <div class="value">${user.role || 'Student'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Account Status</div>
                        <div class="value">${user.isActive ? 'Active' : 'Inactive'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Last Login</div>
                        <div class="value">${user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never'}</div>
                    </div>
                </div>

                <div class="profile-section">
                    <h3>Personal Information</h3>
                    <div class="profile-item">
                        <div class="label">First Name</div>
                        <div class="value">${profile.firstName || 'Not set'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Last Name</div>
                        <div class="value">${profile.lastName || 'Not set'}</div>
                    </div>
                    <div class="profile-item">
                        <div class="label">Enrollment Number</div>
                        <div class="value">${profile.enrollmentNumber || 'Not set'}</div>
                    </div>
                </div>
            `;

            // Add additional profile fields if they exist
            if (profile.gender || profile.tenthBoard || profile.twelfthBoard) {
                html += `
                    <div class="profile-section">
                        <h3>Academic Information</h3>
                        ${profile.gender ? `
                            <div class="profile-item">
                                <div class="label">Gender</div>
                                <div class="value">${profile.gender}</div>
                            </div>
                        ` : ''}
                        ${profile.tenthBoard ? `
                            <div class="profile-item">
                                <div class="label">10th Board</div>
                                <div class="value">${profile.tenthBoard}</div>
                            </div>
                        ` : ''}
                        ${profile.tenthPercentage ? `
                            <div class="profile-item">
                                <div class="label">10th Percentage</div>
                                <div class="value">${profile.tenthPercentage}%</div>
                            </div>
                        ` : ''}
                        ${profile.twelfthBoard ? `
                            <div class="profile-item">
                                <div class="label">12th Board</div>
                                <div class="value">${profile.twelfthBoard}</div>
                            </div>
                        ` : ''}
                        ${profile.twelfthPercentage ? `
                            <div class="profile-item">
                                <div class="label">12th Percentage</div>
                                <div class="value">${profile.twelfthPercentage}%</div>
                            </div>
                        ` : ''}
                        ${profile.stream ? `
                            <div class="profile-item">
                                <div class="label">Stream</div>
                                <div class="value">${profile.stream}</div>
                            </div>
                        ` : ''}
                        ${profile.cpga ? `
                            <div class="profile-item">
                                <div class="label">CGPA</div>
                                <div class="value">${profile.cpga}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Add placement-related information if available
            if (profile.internships || profile.training || profile.backlog || profile.innovativeProject) {
                html += `
                    <div class="profile-section">
                        <h3>Placement Information</h3>
                        ${profile.internships ? `
                            <div class="profile-item">
                                <div class="label">Internships</div>
                                <div class="value">${profile.internships}</div>
                            </div>
                        ` : ''}
                        ${profile.training ? `
                            <div class="profile-item">
                                <div class="label">Training</div>
                                <div class="value">${profile.training}</div>
                            </div>
                        ` : ''}
                        ${profile.backlog ? `
                            <div class="profile-item">
                                <div class="label">Backlog in Past</div>
                                <div class="value">${profile.backlog}</div>
                            </div>
                        ` : ''}
                        ${profile.innovativeProject ? `
                            <div class="profile-item">
                                <div class="label">Innovative Project</div>
                                <div class="value">${profile.innovativeProject}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            profileContent.innerHTML = html;
        }

        // Handle logout
        function handleLogout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            window.location.href = '/login.html';
        }

        // Show alert message
        function showAlert(type, message) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
